<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' wss: https: data: blob: fonts.googleapis.com fonts.gstatic.com;" />
  <title>Aura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Peek indicator: at bottom of window, visible as 3px glow when pill is edge-hidden -->
    <div id="peek-bar" class="peek-bar hidden"></div>

    <!-- ── Collapsed pill ── -->
    <div id="pill" class="pill">
      <div class="orb-wrap idle" id="orb-wrap">
        <div class="orb-ring"></div>
        <div class="orb-gradient"></div>
        <div class="orb-inner">
          <svg class="orb-icon" id="orb-icon" viewBox="0 0 24 24">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zM19 10v2a7 7 0 0 1-14 0v-2H3v2a9 9 0 0 0 8 8.94V22H8v2h8v-2h-3v-1.06A9 9 0 0 0 21 12v-2h-2z"/>
          </svg>
        </div>
      </div>
      <div id="pill-wave"></div>
      <button id="expand-btn" class="expand-btn" title="Expand / collapse panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="9" height="9">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>
      <button id="close-btn" class="close-btn hidden" title="Stop voice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="11" height="11">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- ── Expanded panel ── -->
    <div id="panel" class="panel hidden">
      <!-- Header: brand + status -->
      <div class="panel-header">
        <div class="brand-mini">
          <div class="brand-orb-mini"></div>
          <span class="brand-name-mini">AURA</span>
        </div>
        <div class="status-mini">
          <span class="status-dot-mini"></span>
          <span id="status-text" class="status-text">LISTENING</span>
        </div>
      </div>

      <!-- Mic waveform -->
      <div id="visualizer" class="visualizer hidden">
        <div class="bars" id="bars"></div>
      </div>

      <!-- Thinking dots -->
      <div id="thinking-anim" class="thinking-anim hidden">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <!-- Speaking wave -->
      <div id="speaking-anim" class="speaking-anim hidden">
        <div class="wave-bars" id="wave-bars"></div>
      </div>

      <!-- AI response text -->
      <div id="transcript" class="transcript hidden"></div>

      <!-- User sent text -->
      <div id="user-text" class="user-text hidden"></div>

      <!-- Text input -->
      <div id="text-input-row" class="text-input-row hidden">
        <input id="text-input" class="text-input" placeholder="Type a message…" autocomplete="off" spellcheck="false" />
        <button id="send-btn" class="send-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>
          </svg>
        </button>
      </div>

      <!-- Error -->
      <div id="error-box" class="error-box hidden"></div>

      <!-- Quick action chips -->
      <div class="chip-row">
        <button class="chip chip-pro" data-quick="agent" title="Agent Console — autonomous mode (Ctrl+Shift+Q)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
            <rect x="4" y="7" width="16" height="12" rx="2"/>
            <path d="M9 7V4M15 7V4M2 13h2M20 13h2"/>
            <circle cx="9.5" cy="13" r="1" fill="currentColor"/>
            <circle cx="14.5" cy="13" r="1" fill="currentColor"/>
          </svg>
        </button>
        <button class="chip chip-pro" data-quick="ask" title="Ask Aura anywhere (Ctrl+Shift+A)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
            <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/>
          </svg>
        </button>
        <button class="chip" data-quick="play_pause" title="Play / Pause media">
          <svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>
        <button class="chip" data-quick="next" title="Next track">
          <svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13">
            <path d="M6 6l8.5 6L6 18V6zm10 0h2v12h-2V6z"/>
          </svg>
        </button>
        <button class="chip" data-quick="clipboard" title="Read clipboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="13" height="13">
            <rect x="7" y="4" width="10" height="16" rx="1.5"/>
            <path d="M10 4V3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1"/>
          </svg>
        </button>
        <button class="chip" data-quick="lock" title="Lock screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="13" height="13">
            <rect x="5" y="11" width="14" height="10" rx="1.8"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
        </button>
      </div>

      <!-- Footer -->
      <div class="panel-footer">
        <button id="keyboard-btn" class="footer-btn" title="Toggle text input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="11" height="11">
            <rect x="2" y="6" width="20" height="12" rx="2"/>
            <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h12"/>
          </svg>
          <span>Type</span>
        </button>
        <button id="dashboard-btn" class="footer-btn footer-btn-primary" title="Open Command Center">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="11" height="11">
            <rect x="3" y="3" width="7" height="9" rx="1.4"/>
            <rect x="14" y="3" width="7" height="5" rx="1.4"/>
            <rect x="14" y="12" width="7" height="9" rx="1.4"/>
            <rect x="3" y="16" width="7" height="5" rx="1.4"/>
          </svg>
          <span>Dashboard</span>
        </button>
        <button id="settings-btn" class="footer-btn settings-btn" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="computer-use.js"></script>
  <script src="gemini-live.js"></script>
  <script src="app.js"></script>
</body>
</html>
