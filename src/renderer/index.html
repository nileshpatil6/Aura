<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' wss: https: data: blob: fonts.googleapis.com fonts.gstatic.com;" />
  <title>Aura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- ── Pill (always visible) ── -->
    <div id="pill" class="pill">
      <div class="orb-wrap idle" id="orb-wrap">
        <div class="orb-ring"></div>
        <div class="orb-gradient"></div>
        <div class="orb-inner">
          <svg class="orb-icon" id="orb-icon" viewBox="0 0 24 24">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zM19 10v2a7 7 0 0 1-14 0v-2H3v2a9 9 0 0 0 8 8.94V22H8v2h8v-2h-3v-1.06A9 9 0 0 0 21 12v-2h-2z"/>
          </svg>
        </div>
      </div>
      <div id="pill-wave"></div>
      <button id="close-btn" class="close-btn hidden" title="Close">✕</button>
    </div>

    <!-- ── Expanded panel ── -->
    <div id="panel" class="panel hidden">
      <div class="panel-header">
        <span class="panel-title">Aura</span>
        <span id="status-text" class="status-text">Listening...</span>
      </div>

      <!-- Mic waveform -->
      <div id="visualizer" class="visualizer hidden">
        <div class="bars" id="bars"></div>
      </div>

      <!-- Thinking dots -->
      <div id="thinking-anim" class="thinking-anim hidden">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <!-- Speaking wave -->
      <div id="speaking-anim" class="speaking-anim hidden">
        <div class="wave-bars" id="wave-bars"></div>
      </div>

      <!-- AI response text -->
      <div id="transcript" class="transcript hidden"></div>

      <!-- User sent text -->
      <div id="user-text" class="user-text hidden"></div>

      <!-- Text input -->
      <div id="text-input-row" class="text-input-row hidden">
        <input id="text-input" class="text-input" placeholder="Type a message…" autocomplete="off" spellcheck="false" />
        <button id="send-btn" class="send-btn">
          <svg viewBox="0 0 24 24" fill="white" width="16" height="16">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>

      <!-- Error -->
      <div id="error-box" class="error-box hidden"></div>

      <!-- Quick chips -->
      <div class="chip-row">
        <button class="chip" data-quick="play_pause" title="Play / Pause">⏯</button>
        <button class="chip" data-quick="next" title="Next track">⏭</button>
        <button class="chip" data-quick="mute" title="Mute">🔇</button>
        <button class="chip" data-quick="clipboard" title="Read clipboard">📋</button>
        <button class="chip" data-quick="minimize" title="Minimize all">🗕</button>
        <button class="chip" data-quick="lock" title="Lock PC">🔒</button>
      </div>

      <!-- Footer -->
      <div class="panel-footer">
        <button id="keyboard-btn" class="footer-btn">⌨  Type instead</button>
        <button id="dashboard-btn" class="footer-btn" title="Open Command Center">⌘ Dashboard</button>
        <button id="settings-btn" class="footer-btn settings-btn" title="API Key settings">&#9881;</button>
      </div>

      <!-- Settings overlay -->
      <div id="settings-overlay" class="settings-overlay hidden">
        <div class="settings-title">Gemini API Key</div>
        <input id="api-key-input" class="text-input" type="password" placeholder="AIza…" autocomplete="off" spellcheck="false" />
        <div class="settings-hint">Get your key at <span class="settings-link">aistudio.google.com</span></div>
        <div class="settings-actions">
          <button id="settings-cancel" class="footer-btn">Cancel</button>
          <button id="settings-save" class="save-btn">Save &amp; Connect</button>
        </div>
      </div>
    </div>
  </div>

  <script src="computer-use.js"></script>
  <script src="gemini-live.js"></script>
  <script src="app.js"></script>
</body>
</html>
