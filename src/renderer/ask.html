<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' wss: https: data: blob: fonts.googleapis.com fonts.gstatic.com;" />
<title>Ask Aura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Instrument Sans', -apple-system, sans-serif; }
  html, body { background: transparent; height: 100%; overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none; }

  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 30px;
    pointer-events: none;
  }

  .askbar {
    width: 720px;
    background: rgba(10, 14, 24, 0.78);
    border: 1px solid rgba(217,138,79, 0.28);
    border-radius: 22px;
    backdrop-filter: blur(40px) saturate(2);
    -webkit-backdrop-filter: blur(40px) saturate(2);
    box-shadow:
      0 30px 90px rgba(0, 0, 0, 0.7),
      0 0 60px rgba(217,138,79, 0.18),
      inset 0 1px 0 rgba(255,255,255,0.06);
    pointer-events: auto;
    overflow: hidden;
    animation: dropIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-30px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .askbar::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 22px;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% -30%, rgba(217,138,79,0.14) 0%, transparent 60%),
      radial-gradient(ellipse at 100% 100%, rgba(147,161,176,0.1) 0%, transparent 50%);
  }

  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 22px;
    position: relative;
    z-index: 1;
  }

  .orb {
    width: 26px; height: 26px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), transparent 50%),
      conic-gradient(from 0deg, #d98a4f, #93a1b0, #d98a4f);
    box-shadow: 0 0 18px rgba(217,138,79, 0.5);
    animation: spin 4s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #q {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: rgba(255,255,255,0.95);
    font-size: 17px;
    font-weight: 400;
    user-select: text;
  }
  #q::placeholder { color: rgba(150, 170, 200, 0.45); }

  .hint {
    font-family: 'Instrument Sans', sans-serif;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(150, 170, 200, 0.45);
    padding: 3px 8px;
    border: 1px solid rgba(150, 170, 200, 0.18);
    border-radius: 6px;
  }

  .preview {
    padding: 0 22px 14px;
    position: relative;
    z-index: 1;
  }
  .preview img {
    max-width: 100%;
    max-height: 240px;
    border-radius: 10px;
    border: 1px solid rgba(217,138,79, 0.2);
    object-fit: contain;
  }

  .reply {
    max-height: 360px;
    overflow-y: auto;
    padding: 0 22px 18px;
    color: rgba(220, 235, 250, 0.92);
    font-size: 14px;
    line-height: 1.7;
    position: relative;
    z-index: 1;
    user-select: text;
  }
  .reply.empty { display: none; }
  .reply pre { background: rgba(0,0,0,0.4); padding: 10px 14px; border-radius: 8px; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .reply code { background: rgba(217,138,79,0.08); padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 12px; }

  .typing {
    display: inline-flex;
    gap: 5px;
    padding: 6px 0;
  }
  .typing span {
    width: 6px; height: 6px;
    background: #d98a4f;
    border-radius: 50%;
    animation: bounce 1.1s ease-in-out infinite;
    box-shadow: 0 0 6px #d98a4f;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); opacity: 0.4; }
    50%      { transform: translateY(-7px); opacity: 1; }
  }

  .actions {
    display: flex;
    gap: 6px;
    padding: 4px 22px 14px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
  }
  .quick {
    padding: 5px 12px;
    background: rgba(217,138,79, 0.08);
    border: 1px solid rgba(217,138,79, 0.2);
    color: #d98a4f;
    font-size: 11px;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.18s;
  }
  .quick:hover { background: rgba(217,138,79, 0.18); border-color: rgba(217,138,79, 0.4); }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: rgba(217,138,79,0.3); border-radius: 2px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="askbar">
      <div class="header">
        <div class="orb"></div>
        <input id="q" placeholder="Ask Aura anything…" autofocus />
        <span class="hint" id="hint">Esc to close</span>
      </div>
      <div class="preview" id="preview" style="display:none"></div>
      <div class="actions" id="actions" style="display:none"></div>
      <div class="reply empty" id="reply"></div>
    </div>
  </div>

  <script>
    const api = window.electronAPI;
    const q       = document.getElementById('q');
    const reply   = document.getElementById('reply');
    const preview = document.getElementById('preview');
    const actions = document.getElementById('actions');
    let imageB64 = null; // for region screenshot mode
    let mode = 'text';   // 'text' | 'image' | 'selection'
    let selectedText = '';

    // ── Receive context from main ─────────────────────────────────────
    api.onAskContext((_e, ctx) => {
      mode = ctx.mode || 'text';
      if (mode === 'image' && ctx.imageB64) {
        imageB64 = ctx.imageB64;
        preview.innerHTML = `<img src="data:image/jpeg;base64,${ctx.imageB64}" />`;
        preview.style.display = 'block';
        q.placeholder = 'Ask anything about this region…';
        showQuickActions(['What is this?', 'Explain this error', 'Summarize the text', 'Translate to English']);
      } else if (mode === 'selection' && ctx.text) {
        selectedText = ctx.text;
        preview.innerHTML = `<div style="padding:12px 14px; background: rgba(147,161,176,0.08); border:1px solid rgba(147,161,176,0.25); border-radius:10px; font-size:12px; color:rgba(220,200,250,0.9); max-height:140px; overflow-y:auto; font-family:'JetBrains Mono', monospace;">${escapeHtml(ctx.text.slice(0, 600))}${ctx.text.length>600?'…':''}</div>`;
        preview.style.display = 'block';
        q.placeholder = 'What should I do with this?';
        showQuickActions(['Explain', 'Summarize', 'Translate to English', 'Rewrite professionally', 'Fix grammar', 'Reply to this']);
      } else {
        q.placeholder = 'Ask Aura anything…';
      }
    });

    function showQuickActions(arr) {
      actions.innerHTML = '';
      arr.forEach(a => {
        const b = document.createElement('button');
        b.className = 'quick';
        b.textContent = a;
        b.onclick = () => { q.value = a; submit(); };
        actions.appendChild(b);
      });
      actions.style.display = 'flex';
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // ── Submit ──────────────────────────────────────────────────────────
    async function submit() {
      const text = q.value.trim();
      if (!text) return;
      reply.classList.remove('empty');
      reply.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      actions.style.display = 'none';

      try {
        const apiKey = await api.storeGet('settings', 'apiKey');
        if (!apiKey) {
          reply.textContent = 'No API key set. Open the dashboard settings to add one.';
          return;
        }

        const memory = await api.storeGet('memory') || {};
        const sys = ['You are Aura, a concise expert assistant. Give direct, useful answers. Use markdown sparingly.'];
        if (memory.name) sys.push(`User: ${memory.name}`);
        if (memory.notes?.length) sys.push(`Context:\n${memory.notes.join('\n')}`);

        const parts = [{ text: mode === 'selection' ? `Selected text:\n\n"""\n${selectedText}\n"""\n\nUser request: ${text}` : text }];
        if (mode === 'image' && imageB64) {
          parts.unshift({ inlineData: { mimeType: 'image/jpeg', data: imageB64 } });
        }

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: sys.join('\n\n') }] },
            contents: [{ role: 'user', parts }],
            generationConfig: {
              maxOutputTokens: 1024,
              thinkingConfig: { thinkingLevel: 'minimal' },
            },
          }),
        });
        if (!res.ok) {
          const t = await res.text();
          reply.textContent = `Error: ${t.slice(0, 200)}`;
          return;
        }
        const j = await res.json();
        const out = j.candidates?.[0]?.content?.parts?.[0]?.text || '(no response)';
        reply.innerHTML = renderMarkdown(out);

        // Save to history
        try {
          await api.storePush('history', { role: 'user', text: text + (mode==='selection' ? ` [on selection]` : mode==='image' ? ` [on region]` : '') });
          await api.storePush('history', { role: 'assistant', text: out });
        } catch {}
      } catch (err) {
        reply.textContent = `Error: ${err.message}`;
      }
    }

    function renderMarkdown(s) {
      // Tiny markdown: code blocks, inline code, bold, line breaks
      s = escapeHtml(s);
      s = s.replace(/```(\w*)\n([\s\S]*?)```/g, (_, l, c) => `<pre>${c}</pre>`);
      s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\n/g, '<br>');
      return s;
    }

    q.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
      if (e.key === 'Escape') { e.preventDefault(); api.closeAsk?.(); }
    });

    // Auto-resize? Not needed - simple input.
    setTimeout(() => q.focus(), 30);
  </script>
</body>
</html>
