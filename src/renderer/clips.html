<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: fonts.googleapis.com fonts.gstatic.com;" />
<title>Clipboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
  html, body { background: transparent; height:100%; overflow:hidden; -webkit-font-smoothing:antialiased; user-select:none; }
  .wrap {
    width: 460px;
    margin: 30px auto;
    background: rgba(10,14,24,0.85);
    border: 1px solid rgba(0,217,255,0.28);
    border-radius: 18px;
    backdrop-filter: blur(40px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 50px rgba(0,217,255,0.15);
    overflow: hidden;
    animation: dropIn 0.3s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes dropIn { from { opacity:0; transform: translateY(-20px) scale(0.97); } to { opacity:1; transform: translateY(0); } }

  .head {
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid rgba(0,217,255,0.12);
  }
  .head .icon {
    width: 24px; height: 24px;
    border-radius: 6px;
    background: linear-gradient(135deg, #00d9ff, #a855f7);
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 13px;
  }
  .head h1 {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.9);
    letter-spacing: 0.04em;
  }
  .head .hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: rgba(150,170,200,0.5);
  }

  .list {
    max-height: 480px;
    overflow-y: auto;
    padding: 8px;
  }
  .item {
    padding: 10px 12px;
    margin-bottom: 4px;
    background: rgba(255,255,255,0.02);
    border: 1px solid transparent;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: text;
  }
  .item:hover {
    background: rgba(0,217,255,0.08);
    border-color: rgba(0,217,255,0.22);
  }
  .item .label {
    font-size: 11px;
    color: #00d9ff;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .item .text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: rgba(220,235,250,0.8);
    line-height: 1.5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item .text.multi {
    white-space: pre-wrap;
    max-height: 60px;
    overflow: hidden;
  }
  .item .time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: rgba(150,170,200,0.35);
    margin-top: 4px;
  }

  .empty {
    padding: 60px 20px;
    text-align: center;
    color: rgba(150,170,200,0.5);
    font-size: 12px;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,217,255,0.25); border-radius:2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="icon">📋</div>
    <h1>Clipboard History</h1>
    <span class="hint">Esc to close</span>
  </div>
  <div class="list" id="list"></div>
</div>

<script>
  const api = window.electronAPI;
  const list = document.getElementById('list');

  async function load() {
    const clips = await api.storeGet('clipboard_history') || [];
    list.innerHTML = '';
    if (clips.length === 0) {
      list.innerHTML = '<div class="empty">No clipboard history yet.<br>Copy something to get started.</div>';
      return;
    }
    clips.slice().reverse().forEach(c => {
      const div = document.createElement('div');
      div.className = 'item';
      const multi = (c.text || '').includes('\n');
      div.innerHTML = `
        <div class="label">${c.label || 'Text'}</div>
        <div class="text ${multi?'multi':''}">${escapeHtml((c.text||'').slice(0, 280))}</div>
        <div class="time">${new Date(c.ts).toLocaleString()}</div>`;
      div.onclick = async () => {
        await api.writeClipboard(c.text);
        api.closeClips?.();
      };
      list.appendChild(div);
    });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') api.closeClips?.();
  });

  load();
</script>
</body>
</html>
