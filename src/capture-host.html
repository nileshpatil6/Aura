<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Aura capture host</title>
</head>
<body>
<script>
// Hidden, never-shown page owned by src/screen-capture.js. It keeps one
// primary-display video stream open and hands back JPEG frames on request, so a
// screenshot costs a canvas encode instead of a desktopCapturer thumbnail.
let stream = null;
let reader = null;
let running = false;
let latest = null;      // newest VideoFrame
let grabbed = null;     // clone of the frame the last grab() encoded, so crop() zooms into the same pixels
let frameAt = 0;        // performance.now() when `latest` arrived
let waiters = [];       // resolvers woken by every new frame

function wake() {
  const list = waiters;
  waiters = [];
  for (const fn of list) fn();
}

// Resolves true once a frame newer than `since` has arrived, false on timeout.
function waitFrame(since, timeoutMs) {
  return new Promise((resolve) => {
    if (frameAt > since) { resolve(true); return; }
    const timer = setTimeout(() => {
      waiters = waiters.filter(w => w !== onFrame);
      resolve(false);
    }, timeoutMs);
    function onFrame() {
      if (frameAt > since) { clearTimeout(timer); resolve(true); }
      else waiters.push(onFrame);
    }
    waiters.push(onFrame);
  });
}

async function pump() {
  try {
    while (running) {
      const r = await reader.read();
      if (r.done) break;
      const prev = latest;
      latest = r.value;
      frameAt = performance.now();
      if (prev) { try { prev.close(); } catch (e) {} }
      wake();
    }
  } catch (e) { /* stream ended */ }
  running = false;
  wake();
}

async function stop() {
  running = false;
  try { if (reader) await reader.cancel(); } catch (e) {}
  try { if (stream) stream.getTracks().forEach(t => t.stop()); } catch (e) {}
  try { if (latest) latest.close(); } catch (e) {}
  try { if (grabbed) grabbed.close(); } catch (e) {}
  stream = null; reader = null; latest = null; grabbed = null; frameAt = 0;
}

async function start(sourceId, maxW, maxH, fps) {
  await stop();
  stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: {
      mandatory: {
        chromeMediaSource: 'desktop',
        chromeMediaSourceId: sourceId,
        maxWidth: maxW,
        maxHeight: maxH,
        maxFrameRate: fps,
      },
    },
  });
  const track = stream.getVideoTracks()[0];
  const processor = new MediaStreamTrackProcessor({ track });
  reader = processor.readable.getReader();
  running = true;
  pump();
  const got = await waitFrame(performance.now(), 3000);
  if (!got || !latest) throw new Error('no first frame');
  return { w: latest.displayWidth, h: latest.displayHeight };
}

function bytesToBase64(bytes) {
  let bin = '';
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(bin);
}

// Waits for a frame that arrived AFTER this call (so a screenshot taken right
// after an action shows the result), falling back to the newest frame when the
// screen is static and the capturer sends nothing new.
// The stream runs at native resolution; the screenshot is scaled to outW x outH.
async function grab(quality, waitMs, outW, outH) {
  if (!running) throw new Error('stream not running');
  const t = performance.now();
  const fresh = await waitFrame(t, waitMs);
  let frame = latest;
  if (!frame) throw new Error('no frame');
  // Read now: pump() closes `frame` when the next one arrives, and a closed frame reports 0x0.
  const srcW = frame.displayWidth;
  const srcH = frame.displayHeight;
  const w = outW || srcW;
  const h = outH || srcH;
  const canvas = new OffscreenCanvas(w, h);
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(frame, 0, 0, w, h);
  try { if (grabbed) grabbed.close(); } catch (e) {}
  grabbed = frame.clone();
  const blob = await canvas.convertToBlob({ type: 'image/jpeg', quality });
  const bytes = new Uint8Array(await blob.arrayBuffer());
  // srcW/srcH: the frame as captured, so the caller can still reject a stale or letterboxed stream.
  return { b64: bytesToBase64(bytes), w, h, srcW, srcH, fresh, ageMs: Math.round(performance.now() - frameAt) };
}

// A region of the last grabbed frame at native resolution, as fractions 0..1,
// scaled so its short side is at least minSide and its long side at most maxSide.
async function crop(l, t, r, b, minSide, maxSide, quality) {
  const frame = grabbed || latest;
  if (!frame) throw new Error('no frame');
  const fw = frame.displayWidth;
  const fh = frame.displayHeight;
  const sx = Math.max(0, Math.floor(l * fw));
  const sy = Math.max(0, Math.floor(t * fh));
  const sw = Math.max(1, Math.min(fw - sx, Math.round((r - l) * fw)));
  const sh = Math.max(1, Math.min(fh - sy, Math.round((b - t) * fh)));
  let s = Math.max(1, minSide / Math.min(sw, sh));
  if (Math.max(sw, sh) * s > maxSide) s = maxSide / Math.max(sw, sh);
  const w = Math.round(sw * s);
  const h = Math.round(sh * s);
  const canvas = new OffscreenCanvas(w, h);
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(frame, sx, sy, sw, sh, 0, 0, w, h);
  const blob = await canvas.convertToBlob({ type: 'image/jpeg', quality });
  const bytes = new Uint8Array(await blob.arrayBuffer());
  // The exact source rect actually used (rounded to pixels), so the caller maps boxes back precisely.
  return { b64: bytesToBase64(bytes), w, h, l: sx / fw, t: sy / fh, r: (sx + sw) / fw, b: (sy + sh) / fh, srcW: sw, srcH: sh };
}
</script>
</body>
</html>
